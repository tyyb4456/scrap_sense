[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "deepagents>=0.7.30",
    "fastapi>=0.161.1",
    "langchain>=1.4.7",
    "langchain-core>=1.7.0",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.16",
    "pydantic-settings>=2.16.1",
    "pydantic[email]>=2.14.1",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
]
